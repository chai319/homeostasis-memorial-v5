<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>恒常性メモリアルV5 全キャラクター立ち絵一覧</title>
<style>
:root{font-family:"Hiragino Sans","Yu Gothic",sans-serif;color:#1b2b39;background:#f4f3ee}
body{margin:0}main{max-width:1200px;margin:auto;padding:clamp(18px,4vw,48px)}
h1{font-size:clamp(1.5rem,4vw,2.3rem)}p{line-height:1.7}a{color:#17527c}
nav{display:flex;flex-wrap:wrap;gap:.45rem;margin:1.5rem 0 2rem}
nav a{background:#e3e9ed;border-radius:4px;padding:.4rem .7rem;text-decoration:none}
details{border-top:1px solid #acbbc2;padding:.9rem 0}
summary{cursor:pointer;font-size:1.2rem;font-weight:bold;padding:.4rem}
h3{font-size:1rem;margin:1.5rem 0 .7rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
figure{margin:0;min-width:0}figure a{display:block}img{display:block;width:100%;height:260px;object-fit:contain;background:#dae3e7}
figcaption{font-size:.86rem;line-height:1.4;margin:.4rem 0}
@media(max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}img{height:220px}}
</style>
</head>
<body><main>
<h1>全キャラクターの立ち絵</h1>
<p>名前を選ぶと、表情・仕草・衣装の差分を表示します。画像を選ぶと原寸で開きます。</p>
<p><a href="index.html">ゲームを開く</a></p>
<nav id="navigation" aria-label="キャラクター"></nav><div id="cast"></div>
</main>
<script src="characters.js"></script>
<script src="asset-manifest.js"></script>
<script src="performance-assets-v45.js"></script>
<script src="lake-sprites-v45.js"></script>
<script src="portrait-collection-v45.js"></script>
<script src="v5-art-data.js"></script>
<script src="v5-expanded-art.js"></script>
<script src="v5-expression-art.js?v=1"></script>
<script>
(function(){
  'use strict';
  const profiles=[
    {id:'twin',female:'水守 瑞葉',male:'水守 瑞太'},
    {id:'ami',female:'糖解 アミ',male:'糖解 アミ'},
    {id:'yori',female:'白守 頼',male:'白守 頼'},
    {id:'tsumugi',female:'結城 つむぎ',fixedArt:'tsumugi'},
    {id:'shiori',female:'備 汐里',fixedArt:'shiori'}
  ];
  for(const [key,person] of Object.entries(window.HMV5Art)){
    const expression={neutral:person.variants.neutral.src},acting={},labels={};
    for(const [pose,asset] of Object.entries(person.variants)){
      if(['neutral','expression'].includes(pose))continue;
      acting[pose]=asset.src;labels[pose]=asset.label;
    }
    for(const [name,asset] of Object.entries(window.HMV5ExpressionArt?.[key]||{}))expression[name]=asset.src;
    if(person.variants.expression){acting['expression-original']=person.variants.expression.src;labels['expression-original']='初登場の反応';}
    window.HM_ASSETS.characters[key]={expression,acting,labels};
  }
  const people=window.HMPortraitCollection.catalog(window.HM_ASSETS,window.HM_LAKE_SPRITES,[...window.HM_CHARACTERS,...profiles]);
  const host=document.getElementById('cast'),nav=document.getElementById('navigation');
  const groups={expression:'基本・表情',acting:'仕草・衣装・特別な立ち絵',swim:'湖上実習'};
  for(const person of people){
    const id='person-'+person.key;
    const label=person.name+(person.gender==='male'?'（男性版）':person.gender==='female'&&!person.key.match(/^(tsumugi|shiori)$/)?'（女性版）':'');
    const link=document.createElement('a');link.href='#'+id;link.textContent=label;nav.append(link);
    const details=document.createElement('details');details.id=id;
    const summary=document.createElement('summary');summary.textContent=label+'　'+person.entries.length+'枚';details.append(summary);
    let populated=false;
    details.addEventListener('toggle',()=>{
      if(!details.open||populated)return;
      populated=true;
      for(const [group,title] of Object.entries(groups)){
        const entries=person.entries.filter(entry=>entry.group===group);
        if(!entries.length)continue;
        const heading=document.createElement('h3');heading.textContent=title;details.append(heading);
        const grid=document.createElement('div');grid.className='grid';
        for(const entry of entries){
          const figure=document.createElement('figure'),a=document.createElement('a'),img=document.createElement('img'),caption=document.createElement('figcaption');
          a.href=entry.src;img.src=entry.src;img.alt=label+'・'+entry.label;img.loading='lazy';img.decoding='async';
          caption.textContent=entry.label;a.append(img);figure.append(a,caption);grid.append(figure);
        }
        details.append(grid);
      }
    });
    link.addEventListener('click',()=>{details.open=true});
    host.append(details);
  }
})();
</script>
</body></html>
